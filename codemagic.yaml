workflows:
  ios-testflight:
    name: Argus — TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m1

    environment:
      vars:
        XCODE_PROJECT: "argus.xcodeproj"
        XCODE_SCHEME: "argus"
        BUNDLE_ID: "com.aliburakyilmaz.argus"
        TEAM_ID: "LBS87M74MD"
      groups:
        - argus_secrets   # Codemagic → variables (otomatik dolduruldu)

    scripts:
      - name: Secrets.xcconfig oluştur
        script: |
          cat > "$CM_BUILD_DIR/Secrets.xcconfig" <<EOF
          TWELVE_DATA_KEY = ${TWELVE_DATA_KEY:-}
          FMP_KEY = ${FMP_KEY:-}
          FINNHUB_KEY = ${FINNHUB_KEY:-}
          TIINGO_KEY = ${TIINGO_KEY:-}
          MARKETSTACK_KEY = ${MARKETSTACK_KEY:-}
          ALPHA_VANTAGE_KEY = ${ALPHA_VANTAGE_KEY:-}
          EODHD_KEY = ${EODHD_KEY:-}
          FRED_KEY = ${FRED_KEY:-}
          CEREBRAS_KEY = ${CEREBRAS_KEY:-}
          GROQ_KEY = ${GROQ_KEY:-}
          GEMINI_KEY = ${GEMINI_KEY:-}
          GEMINI_KEY_BACKUP = ${GEMINI_KEY_BACKUP:-}
          DEEPSEEK_KEY = ${DEEPSEEK_KEY:-}
          GLM_KEY = ${GLM_KEY:-}
          PINECONE_KEY = ${PINECONE_KEY:-}
          PINECONE_BASE_URL = ${PINECONE_BASE_URL:-}
          BORSAPY_KEY = ${BORSAPY_KEY:-}
          BORSAPY_URL = ${BORSAPY_URL:-}
          DOVIZCOM_KEY = ${DOVIZCOM_KEY:-}
          EOF
          echo "Secrets.xcconfig oluşturuldu."

      - name: Kod imzalama (ASC env var'larıyla)
        script: |
          set -e
          keychain initialize

          echo "=== ENV VAR TANI (içerik gizli) ==="
          echo "Key ID uzunluk: ${#APP_STORE_CONNECT_KEY_IDENTIFIER} (beklenen: 10)"
          echo "Key ID ilk 4: ${APP_STORE_CONNECT_KEY_IDENTIFIER:0:4}******"
          echo "Issuer ID uzunluk: ${#APP_STORE_CONNECT_ISSUER_ID} (beklenen: 36)"
          echo "Issuer ID ilk 8: ${APP_STORE_CONNECT_ISSUER_ID:0:8}***-***"
          echo "ASC private key uzunluk: ${#APP_STORE_CONNECT_PRIVATE_KEY} chars"
          echo "ASC private key ilk satır: $(printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY" | head -1)"
          echo "ASC private key son satır: $(printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY" | tail -1)"
          CR_COUNT=$(printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY" | tr -cd '\r' | wc -c | tr -d ' ')
          echo "ASC private key CR (Windows newline) sayısı: $CR_COUNT (beklenen: 0)"
          echo "Cert private key uzunluk: ${#CERTIFICATE_PRIVATE_KEY} chars"

          echo ""
          echo "=== CR temizliği (varsa) ==="
          mkdir -p /tmp/argus_signing
          printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY" | tr -d '\r' > /tmp/argus_signing/asc_key.p8
          printf '%s' "$CERTIFICATE_PRIVATE_KEY" | tr -d '\r' > /tmp/argus_signing/cert_key.pem
          # Eğer son satırda newline yoksa ekle (PEM bunu istiyor)
          [ -n "$(tail -c1 /tmp/argus_signing/asc_key.p8)" ] && echo >> /tmp/argus_signing/asc_key.p8
          [ -n "$(tail -c1 /tmp/argus_signing/cert_key.pem)" ] && echo >> /tmp/argus_signing/cert_key.pem
          echo "Temizlenmiş ASC key satır sayısı: $(wc -l < /tmp/argus_signing/asc_key.p8)"
          echo "Temizlenmiş cert key satır sayısı: $(wc -l < /tmp/argus_signing/cert_key.pem)"

          # Codemagic CLI dosyadan okusun
          export APP_STORE_CONNECT_PRIVATE_KEY="$(cat /tmp/argus_signing/asc_key.p8)"

          echo ""
          echo "=== fetch-signing-files ==="
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@file:/tmp/argus_signing/cert_key.pem \
            --create \
            --verbose

          echo "=== Provisioning profiles ==="
          ls -la "$HOME/Library/MobileDevice/Provisioning Profiles/" 2>&1 || echo "Klasor yok"

          echo "=== Keychain add-certificates ==="
          keychain add-certificates

          echo "=== Code signing identities ==="
          security find-identity -v -p codesigning || true

          echo "=== use-profiles ==="
          xcode-project use-profiles --verbose

          echo "=== Sonuç ==="
          grep "PROVISIONING_PROFILE_SPECIFIER" "$XCODE_PROJECT/project.pbxproj" | head -10 || true

          # Temizlik
          rm -rf /tmp/argus_signing

      - name: Build numarası güncelle
        script: |
          BUILD_NUMBER=$(app-store-connect get-latest-testflight-build-number "$BUNDLE_ID" --platform IOS 2>/dev/null || echo "0")
          agvtool new-version -all $((BUILD_NUMBER + 1))

      - name: Archive ve IPA oluştur
        script: |
          xcode-project build-ipa --verbose \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --archive-flags "-configuration Release -destination generic/platform=iOS -sdk iphoneos DEVELOPMENT_TEAM=$TEAM_ID"

    artifacts:
      - $CM_BUILD_DIR/build/ios/xcarchive/*.xcarchive
      - $CM_BUILD_DIR/build/ios/ipa/*.ipa
      - $CM_EXPORT_DIR/*.ipa

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
