workflows:
  ios-testflight:
    name: Argus — TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m1

    environment:
      vars:
        XCODE_PROJECT: "argus.xcodeproj"
        XCODE_SCHEME: "argus"
        BUNDLE_ID: "com.aliburakyilmaz.argus"
        TEAM_ID: "LBS87M74MD"
      groups:
        - argus_secrets   # Codemagic → variables (otomatik dolduruldu)

    scripts:
      - name: Secrets.xcconfig oluştur
        script: |
          cat > "$CM_BUILD_DIR/Secrets.xcconfig" <<EOF
          TWELVE_DATA_KEY = ${TWELVE_DATA_KEY:-}
          FMP_KEY = ${FMP_KEY:-}
          FINNHUB_KEY = ${FINNHUB_KEY:-}
          TIINGO_KEY = ${TIINGO_KEY:-}
          MARKETSTACK_KEY = ${MARKETSTACK_KEY:-}
          ALPHA_VANTAGE_KEY = ${ALPHA_VANTAGE_KEY:-}
          EODHD_KEY = ${EODHD_KEY:-}
          FRED_KEY = ${FRED_KEY:-}
          CEREBRAS_KEY = ${CEREBRAS_KEY:-}
          GROQ_KEY = ${GROQ_KEY:-}
          GEMINI_KEY = ${GEMINI_KEY:-}
          GEMINI_KEY_BACKUP = ${GEMINI_KEY_BACKUP:-}
          DEEPSEEK_KEY = ${DEEPSEEK_KEY:-}
          GLM_KEY = ${GLM_KEY:-}
          PINECONE_KEY = ${PINECONE_KEY:-}
          PINECONE_BASE_URL = ${PINECONE_BASE_URL:-}
          BORSAPY_KEY = ${BORSAPY_KEY:-}
          BORSAPY_URL = ${BORSAPY_URL:-}
          DOVIZCOM_KEY = ${DOVIZCOM_KEY:-}
          EOF
          echo "Secrets.xcconfig oluşturuldu."

      - name: Kod imzalama (ASC env var'larıyla)
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles

      - name: Build numarası güncelle
        script: |
          BUILD_NUMBER=$(app-store-connect get-latest-testflight-build-number "$BUNDLE_ID" --platform IOS 2>/dev/null || echo "0")
          agvtool new-version -all $((BUILD_NUMBER + 1))

      - name: Archive ve IPA oluştur
        script: |
          xcode-project build-ipa --verbose \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --archive-flags "-configuration Release -destination generic/platform=iOS -sdk iphoneos -resolvePackageDependencies DEVELOPMENT_TEAM=$TEAM_ID"

    artifacts:
      - $CM_BUILD_DIR/build/ios/xcarchive/*.xcarchive
      - $CM_BUILD_DIR/build/ios/ipa/*.ipa
      - $CM_EXPORT_DIR/*.ipa

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
